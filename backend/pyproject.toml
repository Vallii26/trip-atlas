[project]
name = "atlas-backend"
version = "0.1.0"
description = "Atlas: the trip tracker that writes its own story (backend + pipeline)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "numpy>=2.0",
  "exifread>=3.0",
  "piexif>=1.1.3",
  "gpxpy>=1.6",
  "timezonefinder>=6.5",
  "reportlab>=4.2",
  "httpx>=0.27",
  "geonamescache>=2.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6", "hypothesis>=6.100", "ruff>=0.6", "pypdf>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas", "atlas_synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running (hostile-scale) tests, deselected by default"]

[tool.ruff]
line-length = 110
target-version = "py311"
